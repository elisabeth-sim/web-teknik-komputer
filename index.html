<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jurusan Teknik Komputer dan Informatika - Politeknik Negeri Medan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /*  1. Token warna & dasar  */
      :root {
        /* Ubah variabel --bg menjadi linear-gradient */
            --bg: linear-gradient(135deg, #ecebf3 0%, #458947 50%, #082f0f 100%);
            --card: #0b6846;    /* Background kartu  */
            --line: #223024;    /* Garis tepi/border kartu */
            --soft: #656966;    /* Background elemen kecil di dalam kartu */
            --primary: #06ee5f; /* Warna tombol/link  */
            --radius: 12px;
              box-sizing: border-box;
              padding-top: env(safe-area-inset-top, 0px);
              padding-bottom: env(safe-area-inset-bottom, 0px);
        }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        background-attachment: fixed; /* Membuat gradasi tetap saat di-scroll */
        min-height: 100vh; /* Memastikan background memenuhi tinggi layar */
        color: var(--ink);
        font: clamp(15px, .45vw + 11px, 19px)/1.6 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

    /* 2. Layout  */
    main { max-width: 1500px; margin: auto; padding: 20px; }
    .grid { display: grid; gap: 18px; }
    .g2 { grid-template-columns: repeat(2, 1fr); }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .mt { margin-top: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

    @media (max-width: 820px) {
      .g2, .g3, .g4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .g2, .g3, .g4 { grid-template-columns: 1fr; }
    }

    /*  3. Header & navigasi  */
    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 9;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .bar {
      max-width: 1500px;
      margin: auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; line-height: 1.2; }
    .brand small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
    .logo {
      flex: none; width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(#2c82f0, #0b2a5b);
      color: #f6c744; font-size: 13px; font-weight: 800;
    }
    nav { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
    nav a { padding: 6px 10px; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; }
    nav a.on { color: var(--primary); border-color: var(--primary); }
    @media (max-width: 560px) { .bar { flex-wrap: wrap; } }

    /* Dropdown dua kolom pada menu Tentang Kami */
    main [id] { scroll-margin-top: 90px; }
    nav .has-sub > a { position: relative; }
    nav .has-sub:hover > a, nav .has-sub:focus-within > a { color: var(--primary); }
    nav .has-sub:hover > a::after {
      content: ""; position: absolute; left: -20px; right: -20px; top: 100%; height: 30px;
    }
    nav .mega {
      display: none; position: absolute; left: 0; right: 0; top: 100%;
      padding: 22px max(20px, calc((100% - 1500px) / 2 + 20px)) 14px;
      background: #fff; color: #333; border-bottom: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .18);
      grid-template-columns: repeat(2, minmax(0, 360px)); gap: 0 36px;
    }
    nav .has-sub:hover .mega, nav .has-sub:focus-within .mega { display: grid; }
    nav.tutup .mega { display: none !important; }
    nav .mega h4 { margin: 0 0 6px; font-size: 15px; font-weight: 800; text-transform: uppercase; color: #333; }
    nav .mega a {
      display: block; padding: 12px 0; border-bottom: 1px solid #ddd;
      font-size: 13px; font-weight: 500; color: #444;
    }
    nav .mega a:hover { color: #0b6846; }
    @media (max-width: 560px) { nav .mega { grid-template-columns: 1fr; } }

    /* Halaman Fasilitas */
    .pill.top { background: var(--primary); color: #04361f; }
    .pill { white-space: nowrap; }
    .fas-intro { border-left: 5px solid var(--primary); font-size: 16px; line-height: 1.8; }
    .fas-intro p { margin: 0; }
    .fas-list {
      list-style: none; margin: 14px 0 0; padding: 0; counter-reset: n;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px;
    }
    .fas-list li {
      counter-increment: n; display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; background: var(--soft);
      font-size: 13.5px; font-weight: 600;
    }
    .fas-list li::before {
      content: counter(n); flex: none; width: 26px; height: 26px; border-radius: 50%;
      display: grid; place-items: center; background: var(--primary); color: #04361f;
      font-size: 12px; font-weight: 800;
    }
    .galeri { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .galeri figure {
      position: relative; margin: 0; height: 170px; border-radius: 12px; overflow: hidden;
      background: linear-gradient(135deg, #0a325a, #06ee5f);
    }
    .galeri img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .galeri figcaption {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 12px 10px;
      background: linear-gradient(transparent, rgba(0, 0, 0, .72)); color: #fff;
      font-size: 14px; font-weight: 800;
    }
    .tabel-scroll { overflow-x: auto; border-radius: 10px; }
    .tabel-scroll table { min-width: 700px; }
    .tabel-scroll td:first-child { font-weight: 700; }
    @media (max-width: 820px) { .galeri { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .galeri { grid-template-columns: 1fr; } }

    /*  4. Komponen  */
    .btn {
      display: inline-block; padding: 10px 18px;
      border: 1.5px solid var(--primary); border-radius: 8px;
      background: var(--primary); color: #fff;
      font: 700 13px inherit; font-family: inherit; cursor: pointer;
    }
    .btn.outline { background: transparent; color: var(--primary); }

    .card { padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .card h2, .card h3 { margin: 0 0 8px; }

    .section-title {
      display: flex; justify-content: space-between; align-items: center;
      margin: 0 0 12px; padding-left: 10px;
      border-left: 4px solid var(--primary);
      font-size: 19px; font-weight: 800;
    }
    .section-title a, .link { color: var(--primary); font-size: 13px; font-weight: 700; }

    .icon {
      flex: none; width: 36px; height: 36px; border-radius: 9px;
      display: grid; place-items: center;
      background: var(--soft); color: var(--primary); font-weight: 800;
    }
    .stat { padding: 18px 8px; border-radius: 10px; background: var(--soft); text-align: center; }
    .stat b { display: block; font-size: 26px; color: var(--primary); }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--soft); color: var(--primary); font-size: 12px; font-weight: 700; }

    /* Foto berita (kalau tidak ada foto, tampil blok biru) */
    .thumb { height: 110px; margin-bottom: 10px; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, #0b2a5b, #4aa3ff); }
    .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Selayang Pandang & Organisasi (gambar) */
    .sambutan { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
    .sambutan img { width: 100%; border-radius: 10px; display: block; }
    .sambutan .nama { margin: 8px 0 0; font-size: 14px; line-height: 1.4; }
    .gambar-lebar { display: block; width: 100%; max-height: 340px; object-fit: cover; border-radius: 10px; margin-bottom: 14px; }
    .lambang { display: grid; grid-template-columns: 180px 1fr; gap: 24px; align-items: center; }
    .lambang img { width: 100%; border-radius: 10px; background: #000; }
    .bagan { display: block; max-width: 520px; width: 100%; margin: 0 auto; border-radius: 10px; overflow: hidden; }
    .bagan img { display: block; width: 100%; height: auto; }
    .bagan.sempit { max-width: 260px; }
    @media (max-width: 640px) { .sambutan, .lambang { grid-template-columns: 1fr; } .sambutan img, .lambang img { max-width: 220px; } }
    /* Himne & Mars berdampingan */
    .lagu { display: grid; grid-template-columns: 1fr 1.4fr; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
    .lagu > div { padding: 22px 24px; }
    .lagu h3 { margin: 0 0 10px; font-size: 16px; }
    .lagu p { margin: 0 0 14px; line-height: 1.6; font-size: 14px; }
    .lagu .himne { background: #063d2a; color: #fff; }
    .lagu .himne h3 { color: #fff; }
    .lagu .mars { background: #c4e8d3; color: #0a2417; }
    .lagu .mars h3 { color: #0a2417; }
    @media (max-width: 720px) { .lagu { grid-template-columns: 1fr; } }
    /* Dua gambar Senat sejajar */
    .senat-sejajar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; align-items: start; margin-top: 12px; }
    .senat-sejajar img { display: block; width: 100%; height: auto; border-radius: 10px; }
    @media (max-width: 640px) { .senat-sejajar { grid-template-columns: 1fr; } }
    /* Kalender akademik (gambar) */
    .kalender { display: block; border-radius: 8px; overflow: hidden; background: #fff; }
    .kalender img { display: block; width: 100%; height: auto; }
    .kalender-info { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

    /* Struktur organisasi (gambar) */
        .struktur { display: block; border-radius: 8px; overflow: hidden; background: #fff; }
        .struktur img { display: block; width: 100%; height: auto; }
    .fasilitas-img {
      width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px;
    }

    .breadcrumb { margin: 4px 0 14px; font-size: 13px; color: var(--muted); }
    .breadcrumb a { color: var(--primary); font-weight: 600; }
    h1.page-title { margin: 0 0 6px; font-size: 30px; }
    ul.list, ol.list { padding-left: 20px; }
    .list li { margin: 4px 0; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    th { background: var(--soft); }

    label { font-size: 13px; font-weight: 600; }
    input, textarea {
      width: 100%; margin: 4px 0 12px; padding: 10px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--ink); font: inherit;
    }
    .ok { color: #168a4a; font-weight: 700; }
    footer { padding: 24px; text-align: center; font-size: 13px; color: var(--muted); }

    /* Daftar jurusan di halaman Program Studi */
    .jurusan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px 24px;
    }
    .jurusan-label {
      display: inline-block; margin: 0 0 10px; padding: 8px 20px;
      background: #ffffff; color: #020506; font-size: 14px; font-weight: 700;
    }
    .jurusan-prodi { margin: 0; padding: 0; list-style: none; }
    .jurusan-prodi li { margin: 6px 0; line-height: 1.3; font-size: 13px; color: #d5d3db; }
    /* Hanya program studi yang bisa dibuka tampil sebagai link */
    .jurusan-prodi a { color: #6ea8ff; font-weight: 700; text-decoration: underline; }
    .jurusan-prodi a:hover { color: #fff; }
    @media (max-width: 820px) { .jurusan-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .jurusan-grid { grid-template-columns: 1fr; } }

    /*  5. Beranda  */
    .hero {
  position: relative; overflow: hidden; min-height: 340px; padding: 56px 44px;
  border-radius: 14px; color: #9fade0;
  background:
    linear-gradient(100deg, #1f54aa 0%, #1f54aa 10%, rgba(31, 84, 170, .6) 65%, rgba(31, 111, 235, .15) 100%),
    url("imagee/gedungpolmed.jpeg") center right / cover no-repeat,
    #1f54aa;
    }
    
    .hero > * { position: relative; z-index: 1; max-width: 520px; }
    .hero h1 { margin: 8px 0; font-size: clamp(30px, 5vw, 46px); line-height: 1.1; font-weight: 800; }
    .hero h1 b { color: #0a325a; }
    .hero .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
    @media (max-width: 820px) { .hero { padding: 36px 22px; } }

    /* Hero selebar layar penuh (isi tetap sejajar dengan konten di bawahnya) */
    body { overflow-x: clip; }
    .hero {
      width: 100vw; margin-left: calc(50% - 50vw); margin-top: -20px; border-radius: 0;
      min-height: clamp(340px, 36vw, 520px);
      padding: clamp(40px, 6vw, 84px) max(20px, calc((100vw - 1500px) / 2 + 20px));
    }
    .hero > * { max-width: 620px; }

    /* Tombol Sistem Akademik di header */
    .btn-sa { flex: none; padding: 9px 16px; border-radius: 8px; background: var(--primary); color: #04361f; font-size: 13px; font-weight: 800; white-space: nowrap; }
    .btn-sa:hover { filter: brightness(1.08); }

    /* Halaman Sistem Informasi */
    .si-panel { background: #fff; color: #333; border-radius: var(--radius); overflow: hidden; }
    .si-banner { position: relative; min-height: 180px; display: flex; align-items: center; padding: 0 clamp(20px, 5vw, 64px);
      background: linear-gradient(120deg, #1a1060, #3b2a9e); color: #fff; font-size: clamp(26px, 4.5vw, 52px); font-weight: 800; font-style: italic; letter-spacing: .02em; }
    .si-banner small { display: block; font-size: .32em; font-style: normal; font-weight: 600; letter-spacing: .15em; opacity: .85; }
    .si-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .si-judul { background: #fcc92e; color: #1b1b1b; text-align: center; padding: 16px 12px; font-weight: 800; font-size: clamp(14px, 1.6vw, 18px); }
    .si-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 36px 20px; padding: clamp(24px, 4vw, 48px); }
    .si-item { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
    .si-ikon { width: 84px; height: 84px; display: grid; place-items: center; font-size: 52px; line-height: 1; }
    .si-ikon img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .si-item a.nama { display: inline-block; padding: 4px 16px; background: #fcc92e; color: #1b1b1b; font-size: 12px; font-weight: 800; }
    .si-item a.nama:hover { background: #ffd95a; text-decoration: underline; }
    .si-item p { margin: 0; font-size: 12px; color: #555; line-height: 1.5; max-width: 220px; }

    /* Halaman Penelitian */
    .riset-banner { position: relative; overflow: hidden; border-radius: var(--radius); min-height: 200px; margin-bottom: 18px;
      background: linear-gradient(120deg, #0d3a82, #2d9cdb); color: #fff; display: flex; align-items: center; padding: 0 32px; font-size: clamp(24px, 4vw, 44px); line-height: 1.15; font-weight: 800; }
    .riset-banner b { color: #8fe3ff; }
    .riset-banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .riset-band { width: 100vw; margin: 0 0 0 calc(50% - 50vw); padding: 36px max(20px, calc((100vw - 1500px) / 2 + 20px)); }
    .riset-band.navy { background: #0f2547; color: #fff; }
    .riset-band.abu { background: #e4e4e4; color: #333; }
    .riset-row { display: grid; grid-template-columns: minmax(180px, 1fr) 2fr; gap: 24px; align-items: center; }
    .riset-row + .riset-row { margin-top: 28px; }
    .riset-row h3 { margin: 0; font-size: 20px; }
    .riset-item { display: block; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, .35); }
    .riset-item:last-child { border-bottom: 0; }
    .riset-item .tag { display: inline-block; padding: 2px 8px; background: #f7c628; color: #222; font-size: 11px; font-weight: 800; }
    .riset-item p { margin: 8px 0 0; font-size: 13px; font-weight: 700; line-height: 1.5; }
    .riset-item a.tag:hover { background: #ffd95a; text-decoration: underline; }
    .riset-band.putih { background: #fff; padding-top: 0; padding-bottom: 0; text-align: center; }
    .riset-gambar { display: block; width: 100%; max-width: 560px; margin: 0 auto; }
    .riset-band.putih .riset-gambar + .riset-gambar { margin-top: 12px; }
    @media (max-width: 720px) { .riset-row { grid-template-columns: 1fr; gap: 10px; } }

    /* Tombol & jendela Video Profil */
    .btn.garis { background: transparent; border-color: #fff; color: #fff; }
    .btn.garis:hover { background: rgba(255, 255, 255, .15); }
    #video-modal { position: fixed; inset: 0; z-index: 99; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, .85); }
    #video-modal[hidden] { display: none; }
    #video-modal .kotak { position: relative; width: min(960px, 100%); }
    #video-modal .layar { aspect-ratio: 16 / 9; width: 100%; background: #000; border-radius: 12px; overflow: hidden; display: grid; place-items: center; color: #fff; text-align: center; padding: 20px; }
    #video-modal iframe, #video-modal video { width: 100%; height: 100%; border: 0; display: block; }
    #video-modal .tutup-video { position: absolute; top: -44px; right: 0; border: 0; background: none; color: #fff; font-size: 32px; line-height: 1; cursor: pointer; }

    .features {
      position: relative; z-index: 2; margin: -34px 16px 20px; padding: 14px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px;
      background-color: #4aa3ff; border: 1px solid var(--line); border-radius: var(--radius);
    }
    .features div { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; }
  </style>
</head>

<body>
  <header>
    <div class="bar">
      <a class="brand" href="#/">
          <img class="logo" src="imagee/polmed.jpeg" alt="Logo Politeknik Negeri Medan">
        <span>POLITEKNIK NEGERI MEDAN<small>Jurusan Teknik Komputer dan Informatika</small></span>
      </a>
      <nav id="nav" aria-label="Menu utama"></nav>
      <a class="btn-sa" href="https://siakad.polmed.ac.id/?_gl=1*19k0ghp*_ga*OTI5NjE2NDQzLjE3NzQyMzYzNDc.*_ga_DDNCCC18L4*czE3OTIwMzUyOTgkbzE4JGcxJHQxNzkyMDM1NDQ4JGozOSRsMCRoMA.." target="_blank" rel="noopener">🎓 Sistem Akademik</a>
    </div>
  </header>

  <main id="app"></main>

  <footer>© 2026 Teknik Komputer dan Informatika, Politeknik Negeri Medan. All rights reserved</footer>

  <script>
    "use strict";

    /*  1. DATA  */
    const MENU = [
      ["/", "Beranda"], ["/tentang", "Tentang Kami"], ["/prodi", "Pendidikan"],
      ["/penelitian", "Penelitian"], ["/sistem-informasi", "Sistem Informasi"], ["/berita", "Berita"], ["/kontak", "Kontak"]
    ];

    // Daftar jurusan dan program studinya.
    // Format program studi: ["Nama tampil", "kunci"]
    // Hanya kunci yang ada di PRODI dengan buka: true yang menjadi link.
    const JURUSAN = [
      { nama: "Teknik Mesin", prodi: [

      { nama: "Teknik Sipil", prodi: [

        ["Program Studi Manajemen Rekayasa Konstruksi Gedung"] ] },
      { nama: "Teknik Elektro", prodi: [
        ["Program Studi Teknik Listrik"], ["Program Studi Teknik Elektronika"],
        ["Program Studi Teknik Telekomunikasi"],
        ["Program Studi Teknologi Rekayasa Jaringan Telekomunikasi"],
        ["Program Studi Teknologi Rekayasa Instalasi Listrik"],
        ["Program Studi Teknologi Rekayasa Otomasi"] ] },
      { nama: "Teknik Komputer dan Informatika", prodi: [
        ["Program Studi Teknik Komputer", "tk"],
        ["Program Studi Manajemen Informatika", "mi"],
        ["Program Studi Teknologi Rekayasa Perangkat Lunak", "trpl"],
        ["Program Studi Teknologi Rekayasa Multimedia Grafis", "trmg"] ] },
      { nama: "Akuntansi", prodi: [
        ["Program Studi Akuntansi"], ["Program Studi Keuangan dan Perbankan"],
        ["Program Studi Keuangan dan Perbankan Syariah"],
        ["Program Studi Akuntansi Keuangan Publik"],
        ["Magister Terapan Sistem Informasi Akuntansi"] ] },
      { nama: "Administrasi Niaga", prodi: [
        ["Program Studi Administrasi Bisnis"], ["Program Studi Manajemen Bisnis"],
        ["Program Studi Usaha Jasa Konvensi, Perjalanan Insentif dan Pameran"],
        ["Program Studi Bahasa Inggris"] ] }
    ];

    // Halaman yang dihitung sebagai bagian dari menu lain
    const PARENT_MENU = { profil: "tentang", selayang: "tentang", organisasi: "tentang", akademik: "prodi", fasilitas: "prodi" };

    // Dropdown dua kolom di menu Tentang Kami: [judul kolom, [[label, alamat], ...]]

              <img src="imagee/Picture5.png" alt="Pimpinan Politeknik Negeri Medan" onerror="this.remove()">
            </div>
            <div class="bagan" style="margin-top:14px">
              <img src="imagee/Picture6.png" alt="Wakil Direktur Politeknik Negeri Medan" onerror="this.remove()">
            </div>
          </div>

          <div class="card" id="senat">
            <h3>Senat</h3>
            <p><strong>SENAT AKADEMIK</strong><br>${SENAT_AKADEMIK}</p>
            <div class="senat-sejajar">
              <a href="imagee/Picture7.png" target="_blank" rel="noopener" title="Klik untuk memperbesar">
                <img src="imagee/Picture7.png" alt="Anggota Senat Politeknik Negeri Medan" onerror="this.remove()">
              </a>
              <a href="imagee/Picture8.png" target="_blank" rel="noopener" title="Klik untuk memperbesar">
                <img src="imagee/Picture8.png" alt="Anggota Senat Politeknik Negeri Medan (lanjutan)" onerror="this.remove()">
              </a>
            </div>
          </div>

          <div class="card" id="fungsionaris">
            <h3>FUNGSIONARIS JURUSAN 2025 -2029</h3>
          </div>
        </div>
        ${FUNGSIONARIS.map(fungsionaris).join("")}`,

      profil: () => pageHead([["Tentang Kami", "/tentang"], ["Profil"]], "Profil") + `
        <div class="grid">
          <div class="card">
            <h3>Sejarah Singkat</h3>
            <p>Jurusan Teknik Komputer dan Informatika merupakan salah satu jurusan di Politeknik Negeri Medan yang bergerak di bidang teknologi komputer dan informatika.
              Polmed awalnya berdiri sebagai Politeknik Universitas Sumatera Utara pada tahun 1982. Pada tahun 1997, Politeknik USU berubah menjadi Politeknik Negeri Medan
              (Polmed). Seiring perkembangan teknologi, jurusan ini terus mengembangkan pendidikan di bidang komputer, jaringan, perangkat lunak, dan sistem informasi.
              Jurusan ini berkomitmen menghasilkan lulusan yang kompeten dan siap menghadapi kebutuhan dunia industri.</p>
            <h3>Fasilitas</h3>
            ${list(["Laboratorium jaringan dan keamanan", "Laboratorium pemrograman dan basis data", "Laboratorium IoT dan robotika", "Ruang kolaborasi proyek mahasiswa"])}
          </div>
        </div>`,

        prodi: (key) => {
  // Daftar jurusan + program studi
  if (!key) {
    return pageHead([["Pendidikan"]], "Pendidikan") +
      `<div class="card" style="margin-bottom:24px"><h3>Pendidikan</h3><p>${PENDIDIKAN}</p></div>` +
      `<div class="jurusan-grid">${JURUSAN.map(jurusanCard).join("")}</div>` +
      `<div class="card mt" id="akademik">
        <h3>Akademik</h3>
        <h3 style="font-size:15px;color:var(--muted)">Kalender Akademik Semester Ganjil 2025/2026</h3>
        <a class="kalender" href="imagee/kalender.png" target="_blank" rel="noopener" title="Klik untuk memperbesar">
          <img src="imagee/kalender.png" alt="Kalender Akademik Semester A (Ganjil) Tahun Akademik 2025/2026 Politeknik Negeri Medan">
        </a>
        <p class="kalender-info">Bila ada perubahan tentang hari libur akan diumumkan kemudian.</p>
      </div>`;
  }

  // Hanya program studi yang buka: true yang punya halaman
  if (!bisaDibuka(key)) return pages.notFound();
  const p = PRODI[key];

  return pageHead([["Pendidikan", "/prodi"], [p.nama]], p.nama) + `
    <p style="color:var(--muted)">${p.ringkas}</p>

    <div class="card">
      <h3>Informasi Program</h3>
      <table>
        ${baris("Jurusan", p.jurusan)}
        ${baris("Institusi", "Politeknik Negeri Medan")}
        ${baris("Website", `<a class="link" href="${p.situs}" target="_blank" rel="noopener">${p.situs.replace("https://", "").replace(/\/$/, "")}</a>`)}
      </table>
    </div>

    ${p.visi ? `
    <div class="card mt">
      <h3>Visi</h3>
      <p>${p.visi}</p>
      ${p.misi ? `<h3>Misi</h3>${list(p.misi)}` : ""}
    </div>` : ""}

    ${p.struktur ? `
    <div class="card mt">
      <h3>${p.struktur.judul}</h3>
      <a class="struktur" href="${p.struktur.foto}" target="_blank" rel="noopener" title="Klik untuk memperbesar">
        <img src="${p.struktur.foto}" alt="${esc(p.struktur.judul)}">
      </a>
      <p class="kalender-info">Klik gambar untuk melihat ukuran penuh.</p>
    </div>` : ""}

    <p><a class="link" href="#/prodi">← Semua program studi</a></p>`;
},



      akademik: () => pages.prodi(),

      fasilitas: () => pageHead([["Fasilitas"]], "Fasilitas") + `
        <div class="grid">
          <section class="card fas-intro"><p>${FAS_INTRO}</p></section>

          <section class="card">
            <h2 class="section-title">Laboratorium</h2>
            <p>${FAS_LAB.isi}</p>
            <p><strong>${FAS_LAB.pengantar}</strong></p>
            ${list(FAS_LAB.daftar).replace('<ul class="list">', '<ul class="fas-list">')}
          </section>

          <section class="card">
            <h2 class="section-title">Workshop</h2>
            <p>${FAS_WORKSHOP.isi}</p>
            <p><strong>${FAS_WORKSHOP.pengantar}</strong></p>
            ${list(FAS_WORKSHOP.daftar).replace('<ul class="list">', '<ul class="fas-list">')}
          </section>

          <section class="card">
            <h2 class="section-title">Galeri Fasilitas</h2>
            <div class="galeri">${GALERI.map(([label, src]) =>
              `<figure><img src="${src}" alt="${esc(label)}" onerror="this.remove()"><figcaption>${label}</figcaption></figure>`
            ).join("")}</div>
          </section>

          <section class="card">
            <h2 class="section-title">Akreditasi Program Studi</h2>
            <div class="tabel-scroll">
              <table>
                <tr><th>PROGRAM STUDI</th><th>Peringkat</th><th>NO SK</th><th>Tanggal Kadaluarsa</th></tr>
                ${AKREDITASI.map(([prodi, rank, sk, tgl, url]) => `
                <tr>
                  <td>${prodi}</td>
                  <td><span class="pill${rank === "Unggul" || rank === "A" ? " top" : ""}">${rank}</span></td>
                  <td><a class="link" href="${url}" target="_blank" rel="noopener">${sk}</a></td>
                  <td>${tgl}</td>
                </tr>`).join("")}
              </table>
            </div>
          </section>
        </div>`,

      "sistem-informasi": () => {
        const S = SISTEM_INFO;
        const ikon = (i) => (i.includes("/") ? `<img src="${i}" alt="" onerror="this.remove()">` : i);
        return pageHead([["Sistem Informasi"]], "Sistem Informasi") + `
        <div class="si-panel">
          <div class="si-banner">
            <div><small>POLITEKNIK NEGERI MEDAN</small>INFORMATION SYSTEM</div>
            <img src="${S.banner}" alt="Information System Politeknik Negeri Medan" onerror="this.remove()">
          </div>
          <div class="si-judul">${S.judul}</div>
          <div class="si-grid">
            ${S.item.map((x) => `
            <div class="si-item">
              <div class="si-ikon">${ikon(x.ikon)}</div>
              <a class="nama" href="${x.url}" target="_blank" rel="noopener">${x.nama}</a>
              <p>${x.ket}</p>
            </div>`).join("")}
          </div>
        </div>`;
      },

      penelitian: () => {
        const P = PENELITIAN;
        const item = ([tag, url, teks]) => `<div class="riset-item"><a class="tag" href="${url}" target="_blank" rel="noopener">${tag}</a><p>${teks}</p></div>`;
        return `
        <div class="riset-banner">
          <div>Research<br><b>Excellencies.</b></div>
          <img src="imagee/bannery.jpg" alt="Research Excellencies - Politeknik Negeri Medan" onerror="this.remove()">
        </div>
        <div class="card"><p style="margin:0">${P.isi}</p></div>

        <section class="riset-band navy mt">
          <div class="riset-row"><h3>Peluang Hibah Penelitian</h3><div>${P.hibah.map(item).join("")}</div></div>
          <div class="riset-row"><h3>Journal Polmed</h3><div>${P.jurnal.map(item).join("")}</div></div>
        </section>

        <section class="riset-band abu">
          <div class="riset-row"><h3>Proyek penelitian</h3><p style="margin:0;font-size:14px;line-height:1.7">${P.proyek}</p></div>
        </section>

        <section class="riset-band putih">
          ${P.gambar.map((g) => `<img src="imagee/TOP-10.jpg" src="${g}" alt="Top 10 Research Publication" onerror="this.remove()">`).join("")}
        </section>`;
      },

      berita: (id) => {
        if (!id) return pageHead([["Berita"]], "Berita & Kegiatan") + `<div class="grid g3">${beritaCards()}</div>`;
        const n = BERITA.find((b) => b.id === Number(id));
        if (!n) return pages.notFound();
        return breadcrumb(["Berita", "/berita"], [n.judul]) + `
          <article class="card" style="max-width:760px">
            <small style="color:var(--muted)">${n.tanggal}</small>
            <h1 class="page-title">${n.judul}</h1>
            <div class="thumb" style="height:260px">${foto(n)}</div>
            ${n.isi.map((p) => `<p>${p}</p>`).join("")}
            <a class="link" href="#/berita">← Kembali ke berita</a>
          </article>`;
      },

      kontak: () => pageHead([["Kontak"]], "Kontak") + `
        <div class="grid g2">
          <div class="card">
            <h3>Alamat</h3>
            <p><br>Politeknik Negeri Medan<br>Jl. Almamater No. 1, Kampus USU</p>
            <p> Medan, Sumatera Utara 20155 </p>
            <p>Email: polmed@polmed.ac.id  <br>Telepon: 061- 8211235</p>
          </div>
          <div class="card">
            <h3>Kirim Pesan</h3>
            <div id="kontak-form">
              <label for="k-nama">Nama</label><input id="k-nama">
              <label for="k-email">Email</label><input id="k-email" type="email">
              <label for="k-pesan">Pesan</label><textarea id="k-pesan" rows="4"></textarea>
              <button class="btn" onclick="kirimPesan()">Kirim pesan</button>
            </div>
          </div>
        </div>`,

      notFound: () => `<div class="card"><h2>Halaman tidak ditemukan</h2><a class="link" href="#/">Kembali ke beranda</a></div>`
    };

    /*  5. AKSI (form kontak)  */
    function kirimPesan() {
      if (!$("#k-nama").value.trim() || !$("#k-pesan").value.trim()) {
        alert("Isi nama dan pesan terlebih dahulu.");
        return;
      }
      $("#kontak-form").innerHTML = '<p class="ok">Pesan terkirim. Terima kasih, kami akan membalas lewat email.</p>';
    }

    /*  6. ROUTER  */
    function render() {
      const [name = "", param] = location.hash.slice(1).split("/").filter(Boolean);
      const page = name === "" ? pages.beranda : pages[name];

      $("#app").innerHTML = page && name !== "notFound" ? page(param) : pages.notFound();

      const active = "/" + (name in PARENT_MENU ? PARENT_MENU[name] : name);
      $("#nav").innerHTML = MENU
        .map(([path, label]) => {
          const cls = path === active ? ' class="on" aria-current="page"' : "";
          const sub = DROPDOWN[path];
          if (!sub) return `<a href="#${path}"${cls}>${label}</a>`;
          return `<div class="has-sub"><a href="#${path}"${cls}>${label} <span aria-hidden="true">⌄</span></a>
            <div class="mega">${sub.map(([judul, items]) =>
              `<div><h4>${judul}</h4>${items.map(([l, p]) => /^https?:/.test(p) ? `<a href="${p}" target="_blank" rel="noopener">${l}</a>` : `<a href="#${p}">${l}</a>`).join("")}</div>`
            ).join("")}</div></div>`;
        })
        .join("");

      // Link dropdown menuju bagian tertentu di halaman Selayang Pandang / Organisasi
      const tujuan = name === "akademik" ? document.getElementById("akademik") : ((name === "selayang" || name === "organisasi") && param ? document.getElementById(param) : null);
      if (tujuan) tujuan.scrollIntoView(); else window.scrollTo(0, 0);
    }

    // Tutup dropdown setelah salah satu link-nya diklik
    $("#nav").addEventListener("click", (e) => { if (e.target.closest(".mega")) $("#nav").classList.add("tutup"); });
    $("#nav").addEventListener("mouseleave", () => $("#nav").classList.remove("tutup"));

    // Video Profil (jendela pop-up)
    const vm = document.createElement("div");
    vm.id = "video-modal"; vm.hidden = true;
    vm.innerHTML = '<div class="kotak"><button class="tutup-video" aria-label="Tutup video">×</button><div class="layar"></div></div>';
    document.body.appendChild(vm);

    function bukaVideo() {
      const layar = vm.querySelector(".layar");
      layar.innerHTML = `<video src="${esc(VIDEO_PROFIL)}" controls autoplay playsinline></video>`;
      layar.querySelector("video").addEventListener("error", () => {
        layar.innerHTML = "<p>Video tidak ditemukan. Pastikan file " + esc(VIDEO_PROFIL) + " ada.</p>";
      });
      vm.hidden = false;
    }
    const tutupVideo = () => { vm.hidden = true; vm.querySelector(".layar").innerHTML = ""; };

    $("#app").addEventListener("click", (e) => { if (e.target.closest("[data-video]")) bukaVideo(); });
    vm.addEventListener("click", (e) => { if (e.target === vm || e.target.closest(".tutup-video")) tutupVideo(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !vm.hidden) tutupVideo(); });
    window.addEventListener("hashchange", tutupVideo);

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
